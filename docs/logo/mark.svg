<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Japan Metros">
  <!-- Japan Metros mark: the Meijo loop (purple, DIC 106) pierced by the Higashiyama line (yellow, DIC 2534).
       The two white dots are the real interchanges where the yellow line crosses the ring: Sakae and Motoyama. -->
  <circle cx="24" cy="26" r="14" fill="none" stroke="#B074D6" stroke-width="6"/>
  <rect x="1" y="22.5" width="46" height="7" rx="3.5" fill="#FAB123"/>
  <circle cx="10.5" cy="26" r="3" fill="#ffffff"/>
  <circle cx="37.5" cy="26" r="3" fill="#ffffff"/>
</svg>
